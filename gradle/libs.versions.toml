[versions]

# Sdk
sdk-min = "24"
sdk-target = "37"
sdk-compile = "37"

# Plugin
plugin-agp = "9.4.1"
plugin-kotlin = "2.4.21"

# BOM
bom-compose = "2026.09.00"

# AndroidX
androidx-activity-compose = "1.13.0"
androidx-lifecycle = "2.11.0"

# Third Party
third-party-reachard = "3.0.1"

# Unit Test
unit-test-junit = "4.13.2"

[plugins]

android-application = { id = "com.android.application", version.ref = "plugin-agp" }
android-library = { id = "com.android.library", version.ref = "plugin-agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "plugin-kotlin" }

[libraries]

# BOM Compose
bom-compose = { group = "androidx.compose", name = "compose-bom", version.ref = "bom-compose" }
bom-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
bom-compose-runtime-livedata = { group = "androidx.compose.runtime", name = "runtime-livedata" }
bom-compose-ui = { group = "androidx.compose.ui", name = "ui" }
bom-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

# AndroidX
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "androidx-lifecycle" }

# Third Party
third-party-reachard-di = { group = "com.github.kuyucuburak.reachard", name = "reachard-di", version.ref = "third-party-reachard" }
third-party-reachard-namifier = { group = "com.github.kuyucuburak.reachard", name = "reachard-namifier", version.ref = "third-party-reachard" }

# Unit Test
unit-test-junit = { group = "junit", name = "junit", version.ref = "unit-test-junit" }
